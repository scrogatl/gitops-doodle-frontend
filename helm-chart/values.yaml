name: doodle-frontend
replicaCount: 1
labels:
  app.kubernetes.io/name: doodle-frontend
  app.kubernetes.io/instance: frontend-instance
  app.kubernetes.io/version: "0.9.1"
  app.kubernetes.io/component: service
  app.kubernetes.io/part-of: helloworld
image:
  repository: ghcr.io/scrogatl/doodle-frontend
  tag: main
  pullPolicy: Always
containerName: doodle-frontend
env:
- name: HELLO_HOST
  value: doodle-hello
- name: WORLD_HOST
  value: doodle-world
- name: WORLD_HOST_RUBY
  value: doodle-world-ruby
- name: WPORT
  value: '5002'
- name: WPORT_RUBY
  value: '5003'
- name: SHARD
  value: blue
- name: PYTHONUNBUFFERED
  value: '1'
- name: RUBY_WORLD
  value: '5'
ports:
- containerPort: 5000
  name: application
  protocol: TCP
service:
  name: doodle-frontend
  type: ClusterIP
  ports:
  - name: http
    appProtocol: http
    port: 5000
